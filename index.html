<style>
:root{--bg:#07080A;--pt:#CFE3F2;--pt-d:rgba(207,227,242,.14);--warn:#f2c98f;

 transition:height 1.3s cubic-bezier(.77,0,.18,1),background .8s,border-color .8s;border-bottom:1px solid transparent}

.dot{width:7px;height:7px;flex:none;border-radius:50%;background:var(--pt);animation:pulse 2.2s infinite}

#app{position:relative;z-index:10;max-width:1180px;margin:0 auto;padding:108px 22px 40px;opacity:0;transform:translateY(24px);transition:opacity 1.1s .5s,transform 1.1s .5s}

.modebar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.badge{font-family:var(--fd);font-size:.62rem;letter-spacing:.25em;padding:8px 14px;border-radius:999px;border:1px solid rgba(159,224,196,.45);color:#c9f5e1;background:rgba(159,224,196,.06)}

.sw input{appearance:none;-webkit-appearance:none;width:40px;height:22px;border-radius:999px;border:1px solid var(--pt-d);background:rgba(207,227,242,.05);position:relative;cursor:pointer;transition:.3s;margin:0}

.sw input:checked{background:rgba(242,201,143,.25);border-color:var(--warn)}
.sw input:checked:after{left:20px;background:var(--warn)}
.info{min-height:0;font-size:.82rem;line-height:1.5;color:var(--warn);margin:0 0 14px;padding:0 4px}
.info:empty{display:none}
.bar{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-bottom:22px}
.sel{position:relative}

.sel:after{content:"";position:absolute;right:18px;top:50%;width:7px;height:7px;border-right:1px solid var(--pt);border-bottom:1px solid var(--pt);transform:translateY(-70%) rotate(45deg);pointer-events:none}

.panel:before,.btn:before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;z-index:3;pointer-events:none;

.inner{position:relative;background:linear-gradient(160deg,rgba(14,17,22,.88),rgba(8,10,13,.92));backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:21px;height:100%;display:flex;flex-direction:column;min-height:300px}

textarea,#out{flex:1;width:100%;min-height:200px;max-height:60vh;background:transparent;border:0;outline:0;resize:none;color:#EAF3FA;font-size:1.18rem;line-height:1.65;font-weight:300;padding:16px 20px;font-family:var(--fb)}

.tools{display:flex;gap:10px;align-items:center;padding:10px 16px 16px;flex-wrap:wrap}
.ib{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--pt-d);background:rgba(207,227,242,.03);color:var(--pt);border-radius:11px;padding:9px 15px;font-family:var(--fd);font-size:.7rem;letter-spacing:.2em;cursor:pointer;transition:.35s;text-transform:uppercase}
.ib:hover{border-color:rgba(207,227,242,.55);background:rgba(207,227,242,.09);transform:translateY(-1px)}
.ib[hidden]{display:none}

.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(207,227,242,.38);background:linear-gradient(180deg,rgba(207,227,242,.12),rgba(207,227,242,.03));color:#fff;border-radius:13px;padding:13px 26px;font-family:var(--fd);font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;transition:.45s}

@keyframes rise{from{opacity:0;transform:translateY(10px)}}
footer{margin-top:40px;text-align:center;font-family:var(--fd);font-size:.58rem;letter-spacing:.35em;color:rgba(207,227,242,.3)}
footer .f2{display:block;margin-top:8px;letter-spacing:.15em}
.ul{margin-top:16px;display:flex;justify-content:center;gap:6px}
.ul button{background:none;border:1px solid transparent;color:rgba(207,227,242,.4);font:inherit;letter-spacing:.2em;padding:5px 10px;border-radius:8px;cursor:pointer;transition:.3s}
.ul button:hover,.ul button.on{color:var(--pt);border-color:var(--pt-d)}
@media(max-width:820px){.cols{grid-template-columns:1fr}.bar{grid-template-columns:1fr 52px 1fr;gap:8px}.sel select{padding:14px 30px 14px 12px;font-size:.66rem;letter-spacing:.06em}
 #app{padding:96px 16px 30px}#hdr.done #logo{font-size:1.25rem}.btn{padding:12px 18px;flex:1;justify-content:center}.hc{width:22px;height:22px}#status{letter-spacing:.25em;font-size:.6rem}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>

<body>
<div class="grid-bg"></div><div class="glow"></div>
<i class="hc tl"></i><i class="hc tr"></i><i class="hc bl"></i><i class="hc br"></i>

<header id="hdr">
  <div id="logo">KORA</div>
  <div id="status"><span class="dot"></span><span data-i18n="status">AI TRANSLATION SYSTEM</span></div>
</header>

<main id="app">
  <div class="modebar">
    <span id="badge" class="badge"></span>
    <label class="sw"><input type="checkbox" id="online"><span data-i18n="online">Online</span></label>
  </div>
  <div id="info" class="info" role="status"></div>

  <div class="bar">
    <div class="sel"><select id="src" aria-label="Source"></select></div>
    <button id="swap" aria-label="Swap"><span>⇄</span></button>
    <div class="sel"><select id="tgt" aria-label="Target"></select></div>
  </div>

  <div class="cols">
    <section class="panel"><div class="inner">
      <div class="lab"><span data-i18n="input">INPUT</span><span id="cnt">0</span></div>
      <textarea id="inp" data-i18n-ph="phIn" spellcheck="false" autofocus></textarea>
      <div class="tools">
        <button class="btn" id="go"><span data-i18n="go">Translate</span></button>
        <button class="ib" id="clr">× <span data-i18n="clear">Clear</span></button>
        <button class="ib" id="pst" data-i18n="paste">Paste</button>
        <button class="ib" id="mic" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          <span id="micT">Speak</span>
        </button>
      </div>
    </div></section>

    <section class="panel b"><div class="inner">
      <div class="lab"><span data-i18n="output">TRANSLATION</span><span class="labr"><span id="prog"></span><span class="spin" id="spin"></span></span></div>
      <div id="out"></div>
      <div class="tools">
        <button class="btn" id="cpy"><span id="cpyT">Copy</span></button>
        <button class="btn" id="spk"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg><span data-i18n="read">Read aloud</span></button>
      </div>
    </div></section>
  </div>

  <div id="hist" hidden>
    <div class="hh"><div><h3 data-i18n="hist">QUICK HISTORY</h3><small data-i18n="histNote"></small></div><button class="ib" id="hclr" data-i18n="clearHist">Clear history</button></div>
    <div id="hl"></div>
  </div>
  <footer><span data-i18n="footer">NATURAL · PRECISE · INSTANTLY CLEAR</span>
    <span class="f2" data-i18n="footer2"></span>
    <div class="ul"><button data-l="de">DE</button><button data-l="tr">TR</button><button data-l="en">EN</button></div>
  </footer>
</main>

 tgt.innerHTML=L.map(c=>`<option value="${c}">${langName(c)}</option>`).join('');
 src.value=sv;tgt.value=tv}
function showPh(){out.innerHTML='';const s=document.createElement('span');s.className='ph'+(errKey?' err':'');s.textContent=errKey?T[ui][errKey]:T[ui].phOut;out.appendChild(s)}
function setInfo(k){$('info').textContent=k?T[ui][k]:''}
function modeUI(){
 const on=isOnline(),b=$('badge');
 b.textContent=on?T[ui].onlineBadge:T[ui].secure;b.classList.toggle('on',on);
 setInfo(on?'onlineWarn':(!hasLocal?'noLocal':''));
 $('mic').hidden=!(SR&&on);if(!on)stopMic()}
function apply(){
 document.documentElement.lang=ui;const t=T[ui];
 document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t[e.dataset.i18n]);
 document.querySelectorAll('[data-i18n-ph]').forEach(e=>e.placeholder=t[e.dataset.i18nPh]);
 $('micT').textContent=recOn?t.listening:t.speak;$('cpyT').textContent=t.copy;
 document.querySelectorAll('.ul button').forEach(b=>b.classList.toggle('on',b.dataset.l===ui));
 buildSelects();modeUI();if(!result)showPh();renderH()}
document.querySelectorAll('.ul button').forEach(b=>b.onclick=()=>{ui=b.dataset.l;try{localStorage.setItem('kora_ui',ui)}catch(e){}apply()});
/* Online-Modus ist bei jedem Laden AUS – muss bewusst eingeschaltet werden */
onl.checked=false;
onl.addEventListener('change',()=>{modeUI();translate()});

setTimeout(()=>{$('hdr').classList.add('done');$('app').classList.add('show')},3300);

/* ---------- Text in Abschnitte teilen (für beliebig lange Texte) ---------- */
function chunks(t,max){const parts=t.match(/[^.!?\n]+[.!?]*\s*|\n/g)||[t],res=[];let c='';
 for(const p of parts){if((c+p).length>max&&c){res.push(c);c=''}
  if(p.length>max){for(let i=0;i<p.length;i+=max)res.push(p.slice(i,i+max))}else c+=p}
 if(c)res.push(c);return res}
const norm=c=>c==='zh-CN'?'zh':c;
function showProgress(i,n){prog.textContent=n>1?`${i}/${n}`:''}

/* ---------- 1) LOKAL: Chrome-eigene Übersetzung auf dem Gerät ---------- */
const trCache=new Map();let detector=null;
function err(code){const e=new Error(code);e.code=code;return e}
async function detect(text){
 if(!hasDetect)throw err('noDetect');
 if(!detector)detector=await LanguageDetector.create();
 const r=await detector.detect(text.slice(0,3000));const top=r&&r[0];
 if(!top||!top.detectedLanguage||top.detectedLanguage==='und'||top.confidence<0.4)throw err('noDetect');
 return top.detectedLanguage}
async function getTranslator(s,t){
 const k=s+'>'+t;if(trCache.has(k))return trCache.get(k);
 const av=await Translator.availability({sourceLanguage:s,targetLanguage:t});
 if(av==='unavailable')throw err('pair');
 if(av!=='available')setInfo('loading');
 const p=Translator.create({sourceLanguage:s,targetLanguage:t});
 trCache.set(k,p);
 try{const tr=await p;if(!isOnline())setInfo(hasLocal?'':'noLocal');return tr}
 catch(e){trCache.delete(k);if(e&&e.name==='NotAllowedError')throw err('needClick');throw e}}
async function localTranslate(text,s,t,my){
 if(!hasLocal)throw err('noLocal');
 if(s==='auto')s=await detect(text);
 s=norm(s);const tt=norm(t);
 if(s===tt||s.split('-')[0]===tt.split('-')[0])return text;
 const tr=await getTranslator(s,tt);
 const parts=chunks(text,1000);let acc='';
 for(let i=0;i<parts.length;i++){
  if(my!==tok)return null;
  const m=parts[i].match(/^(\s*)([\s\S]*?)(\s*)$/);
  acc+=m[1]+(m[2]?await tr.translate(m[2]):'')+m[3];
  if(my!==tok)return null;
  showProgress(i+1,parts.length);
  if(parts.length>1)out.textContent=acc}
 return acc}

/* ---------- 2) ONLINE (nur bewusst eingeschaltet): Google ---------- */
const timeout=ms=>{const c=new AbortController();setTimeout(()=>c.abort(),ms);return c.signal};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function gtx(q,s,t){
 if(!q.trim())return q;
 let lastErr;
 for(let a=0;a<3;a++){
  try{
   const r=await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${encodeURIComponent(s)}&tl=${encodeURIComponent(t)}&dt=t&q=${encodeURIComponent(q)}`,{signal:timeout(10000),credentials:'omit',referrerPolicy:'no-referrer'});
   if(!r.ok)throw new Error('gtx '+r.status);
   const d=await r.json();
   if(!Array.isArray(d)||!Array.isArray(d[0]))throw new Error('gtx format');
   return d[0].map(x=>x&&x[0]||'').join('')
  }catch(e){lastErr=e;await wait(800*(a+1))}}
 throw lastErr}
async function onlineTranslate(text,s,t,my){
 const parts=chunks(text,1500),res=new Array(parts.length);let next=0,done=0;
 async function worker(){
  while(next<parts.length){
   const i=next++;if(my!==tok)return;
   res[i]=await gtx(parts[i],s,t);done++;
   if(my===tok)showProgress(done,parts.length)}}
 await Promise.all([worker(),worker(),worker()]); /* max. 3 gleichzeitig -> keine Sperre bei langen Texten */
 return my===tok?res.join(''):null}

/* ---------- Steuerung ---------- */
async function translate(){
 const text=inp.value.trim(),my=++tok;errKey='';showProgress(0,0);
 if(!text){result='';showPh();spin.classList.remove('on');return}
 spin.classList.add('on');
 try{const s=src.value,t=tgt.value;
  const r=(s===t)?text:(isOnline()?await onlineTranslate(text,s,t,my):await localTranslate(text,s,t,my));
  if(my!==tok||r===null)return;
  result=r;out.textContent=r;spin.classList.remove('on');showProgress(0,0);
  clearTimeout(histTimer);histTimer=setTimeout(()=>saveHist(text,r),1800);
 }catch(e){if(my!==tok)return;spin.classList.remove('on');showProgress(0,0);result='';
  errKey=(e&&e.code&&T[ui][e.code])?e.code:'err';showPh()}}
const deb=()=>{clearTimeout(timer);$('cnt').textContent=inp.value.length;timer=setTimeout(translate,isOnline()?700:450)};
inp.addEventListener('input',deb);
$('go').onclick=()=>{clearTimeout(timer);translate()};

[src,tgt].forEach(s=>s.addEventListener('change',()=>{out.classList.add('swap');setTimeout(()=>out.classList.remove('swap'),350);translate()}));
$('swap').onclick=()=>{
 stopMic();rot+=180;$('swap').firstElementChild.style.transform=`rotate(${rot}deg)`;
 let s=src.value,t=tgt.value;
 if(s==='auto'){s=t;t=(t==='en'?'de':'en')}else{[s,t]=[t,s]}
 const old=result;src.value=s;tgt.value=t;
 if(old){inp.value=old;$('cnt').textContent=old.length}
 out.classList.add('swap');setTimeout(()=>out.classList.remove('swap'),350);translate()};
$('clr').onclick=()=>{stopMic();inp.value='';$('cnt').textContent=0;translate();inp.focus()};
$('pst').onclick=async()=>{try{inp.value=await navigator.clipboard.readText();$('cnt').textContent=inp.value.length;translate()}catch(e){inp.focus()}};

/* ---------- Mikrofon (nur Online-Modus, da Audio an den Browser-Anbieter geht) ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,recOn=false,baseTxt='';
function stopMic(){if(rec&&recOn){try{rec.stop()}catch(e){}}}
function micUI(on){recOn=on;$('mic').classList.toggle('rec',on);$('micT').textContent=on?T[ui].listening:T[ui].speak}
if(SR){
 $('mic').onclick=()=>{
  if(!isOnline()){setInfo('micOnline');return}
  if(recOn){stopMic();return}
  rec=new SR();
  rec.lang=src.value==='auto'?(navigator.language||'en-US'):src.value;
  rec.continuous=true;rec.interimResults=true;
  baseTxt=inp.value&&!/\s$/.test(inp.value)?inp.value+' ':inp.value;
  rec.onstart=()=>micUI(true);
  rec.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;inp.value=baseTxt+t;deb()};
  rec.onerror=()=>micUI(false);
  rec.onend=()=>{micUI(false);clearTimeout(timer);translate()};
  try{rec.start()}catch(e){micUI(false)}}}

/* ---------- Kopieren / Vorlesen ---------- */
$('cpy').onclick=async()=>{if(!result)return;
 try{await navigator.clipboard.writeText(result)}catch(e){const r=document.createRange();r.selectNodeContents(out);const s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');s.removeAllRanges()}
 const b=$('cpy');b.classList.add('ok');$('cpyT').textContent=T[ui].copied;
 setTimeout(()=>{b.classList.remove('ok');$('cpyT').textContent=T[ui].copy},1600)};
$('spk').onclick=()=>{if(!result||!('speechSynthesis' in window))return;
 const sy=speechSynthesis,b=$('spk');
 if(sy.speaking){sy.cancel();b.classList.remove('speaking');return}
 const lang=norm(tgt.value).split('-')[0];
 const voices=sy.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith(lang));
 /* im Lokal-Modus nur Stimmen, die auf dem Gerät laufen */
 const pick=voices.find(v=>v.localService)||(isOnline()?voices[0]:null);
 if(!pick&&!isOnline()){setInfo('noVoice');return}
 const u=new SpeechSynthesisUtterance(result);u.lang=tgt.value;u.rate=.95;if(pick)u.voice=pick;
 u.onend=u.onerror=()=>b.classList.remove('speaking');
 b.classList.add('speaking');sy.speak(u)};
if('speechSynthesis' in window)speechSynthesis.getVoices();

/* ---------- Verlauf: nur im Arbeitsspeicher, wird NICHT gespeichert ---------- */
let H=[];
function saveHist(a,b){if(a.length<2||!b)return;
 H=H.filter(x=>x.a!==a);H.unshift({a,b,s:src.value,t:tgt.value});H=H.slice(0,3);renderH()}
$('hclr').onclick=()=>{H=[];renderH()};
function renderH(){const box=$('hl');$('hist').hidden=!H.length;box.innerHTML='';
 H.forEach((x,i)=>{const e=document.createElement('button');e.className='hi';e.style.animationDelay=i*.08+'s';
  const sm=document.createElement('small'),p1=document.createElement('p'),p2=document.createElement('p');
  const nm=c=>c==='auto'?T[ui].autoS:langName(c);
  sm.textContent=(nm(x.s)+' → '+nm(x.t)).toUpperCase();p1.textContent=x.a;p2.textContent=x.b;p2.style.opacity='.6';
  e.append(sm,p1,p2);
  e.onclick=()=>{src.value=x.s;tgt.value=x.t;inp.value=x.a;result=x.b;out.textContent=x.b;$('cnt').textContent=x.a.length;scrollTo({top:0,behavior:'smooth'})};
  box.appendChild(e)})}

apply();
</script>
</body>
